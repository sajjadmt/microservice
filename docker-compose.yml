version: '3.9'

services:
  # =====================================
  # API GATEWAY - PHP
  # =====================================
  api-gateway-php:
    build:
      context: ./api-gateway
      dockerfile: docker/php/Dockerfile
    container_name: api-gateway-php
    volumes:
      - ./api-gateway:/var/www/html
    networks:
      - app-network
    depends_on:
      - redis
      - product-service-nginx

  # API GATEWAY - NGINX
  api-gateway-nginx:
    image: nginx:stable-alpine
    container_name: api-gateway-nginx
    ports:
      - "8000:80"
    volumes:
      - ./api-gateway:/var/www/html
      - ./api-gateway/docker/nginx/api-gateway.conf:/etc/nginx/conf.d/default.conf
    networks:
      - app-network
    depends_on:
      - api-gateway-php

  # =====================================
  # PRODUCT SERVICE - PHP
  # =====================================
  product-service-php:
    build:
      context: ./product-service
      dockerfile: docker/php/Dockerfile
    container_name: product-service-php
    volumes:
      - ./product-service:/var/www/html
    networks:
      - app-network
    depends_on:
      - redis

  # PRODUCT SERVICE - NGINX
  product-service-nginx:
    image: nginx:stable-alpine
    container_name: product-service-nginx
    ports:
      - "8001:80"
    volumes:
      - ./product-service:/var/www/html
      - ./product-service/docker/nginx/product-service.conf:/etc/nginx/conf.d/default.conf
    networks:
      - app-network
    depends_on:
      - product-service-php

  # =====================================
  # REDIS
  # =====================================
  redis:
    image: redis:alpine
    container_name: micro-redis
    ports:
      - "6379:6379"
    networks:
      - app-network

# =====================================
# NETWORK
# =====================================
networks:
  app-network:
    driver: bridge